name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # Cloned beside the repo, not inside it: a nested hermes-agent/tests/
      # makes pytest pick the wrong rootdir and 'agent' stops importing.
      - run: git clone --depth 1 https://github.com/NousResearch/hermes-agent ../hermes-agent
      - uses: astral-sh/setup-uv@v5
      - name: plugin tests
        run: PYTHONPATH=$PWD/../hermes-agent HERMES_AGENT_SRC=$PWD/../hermes-agent uv run --with pytest --with pyyaml --with rich python -m pytest tests -q
      - name: helper builds
        run: bash helper/build.sh
      - name: app builds and self-tests
        run: |
          cd ui
          ./scripts/test.sh
          swift build -c release
